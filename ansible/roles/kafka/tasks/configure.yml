---
- name: Set Zookeeper myid file
  ansible.builtin.copy:
    content: "{{ broker_id }}"
    dest: "{{ zookeeper_data_dir }}/myid"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0644'
  notify: Restart Zookeeper

- name: Template server.properties
  ansible.builtin.template:
    src: server.properties.j2
    dest: "{{ kafka_install_dir }}/config/server.properties"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0644'
  notify: Restart Kafka

- name: Template zookeeper.properties
  ansible.builtin.template:
    src: zookeeper.properties.j2
    dest: "{{ kafka_install_dir }}/config/zookeeper.properties"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: '0644'
  notify: Restart Zookeeper

- name: Deploy systemd unit files
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: '0644'
  loop:
    - zookeeper
    - kafka
  notify:
    - Reload systemd daemon
    - Restart Zookeeper
    - Restart Kafka

- name: Flush handlers to ensure services start cleanly with configs
  ansible.builtin.meta: flush_handlers

- name: Ensure Zookeeper service is running and enabled
  ansible.builtin.systemd:
    name: zookeeper
    state: started
    enabled: yes

- name: Ensure Kafka service is running and enabled
  ansible.builtin.systemd:
    name: kafka
    state: started
    enabled: yes