---
- name: Check if Kafka binaries already exist
  ansible.builtin.stat:
    path: "{{ kafka_install_dir }}/bin/kafka-server-start.sh"
  register: kafka_binary_check

- name: Download and extract Kafka archive
  ansible.builtin.unarchive:
    src: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ scala_version }}-{{ kafka_version }}.tgz"
    dest: "{{ kafka_install_dir }}"
    remote_src: yes
    extra_opts: ['--strip-components=1']
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
  when: not kafka_binary_check.stat.exists