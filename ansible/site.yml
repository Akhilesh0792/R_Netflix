---
# 1. KAFKA CLUSTER SETUP
- name: Setup Kafka on Brokers via Assignment Role
  hosts: kafka
  become: yes
  roles:
    - kafka

# 2. CREATE KAFKA TOPIC
- name: Create Video Upload Topic on Kafka
  hosts: kafka[0]
  become: yes
  tasks:
    - name: Wait for Kafka broker port 9092 to be actively open
      ansible.builtin.wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 9092
        state: started
        timeout: 120
        delay: 5

    - name: Ensure video-upload-topic exists
      ansible.builtin.shell: |
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
          --bootstrap-server {{ ansible_default_ipv4.address }}:9092 \
          --replication-factor 1 \
          --partitions 3 \
          --topic video-upload-topic
      register: topic_out
      retries: 5
      delay: 5
      until: topic_out.rc == 0

# 3. DEPLOY NETFLIX FRONTEND & CONSUMER
- name: Deploy Netflix Frontend App & S3 Connector
  hosts: netflix_app
  become: yes
  vars:
    ansible_host: "{{ public_ip_address }}"
    kafka_broker_ip: "{{ hostvars[groups['kafka'][0]]['ansible_default_ipv4']['address'] }}"
  tasks:
    - name: Install dependencies via apt
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
          - python3-pip
          - python3-boto3
          - python3-kafka
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: /opt/netflix-app
        state: directory
        owner: ubuntu
        mode: '0755'

    - name: Copy App Code
      ansible.builtin.copy:
        src: ../app/
        dest: /opt/netflix-app/
        owner: ubuntu
        mode: '0755'

    - name: Install NPM Packages
      ansible.builtin.command: npm install
      args:
        chdir: /opt/netflix-app

    - name: Systemd Service for App
      ansible.builtin.copy:
        dest: /etc/systemd/system/netflix-app.service
        content: |
          [Unit]
          Description=Netflix Consumer App
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/opt/netflix-app
          Environment=PORT=5000
          Environment=KAFKA_BROKER={{ kafka_broker_ip }}:9092
          ExecStart=/usr/bin/node server.js
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Systemd Service for S3 Watcher
      ansible.builtin.copy:
        dest: /etc/systemd/system/s3-watcher.service
        content: |
          [Unit]
          Description=S3 Event to Kafka Watcher
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/opt/netflix-app
          Environment=KAFKA_BROKER={{ kafka_broker_ip }}:9092
          Environment=S3_BUCKET_NAME={{ s3_bucket_name }}
          ExecStart=/usr/bin/python3 s3_watcher.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd and start services
      ansible.builtin.systemd:
        daemon_reload: yes
        name: "{{ item }}"
        state: restarted
        enabled: yes
      loop:
        - netflix-app
        - s3-watcher

    - name: Sync existing S3 videos into Kafka on launch
      ansible.builtin.shell: |
        python3 - << 'PYEOF'
        import boto3, json
        from kafka import KafkaProducer

        s3 = boto3.client('s3')
        producer = KafkaProducer(
            bootstrap_servers=['{{ kafka_broker_ip }}:9092'],
            value_serializer=lambda v: json.dumps(v).encode('utf-8')
        )

        response = s3.list_objects_v2(Bucket='{{ s3_bucket_name }}')
        for item in response.get('Contents', []):
            key = item['Key']
            if key.lower().endswith(('.mp4', '.mkv', '.webm')):
                msg = {
                    'event': 'video_upload',
                    'bucket': '{{ s3_bucket_name }}',
                    'key': key,
                    'url': f"https://{{ s3_bucket_name }}.s3.amazonaws.com/{key}"
                }
                producer.send('video-upload-topic', msg)
        producer.flush()
        PYEOF
      args:
        chdir: /opt/netflix-app