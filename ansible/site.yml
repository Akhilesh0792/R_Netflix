---
- name: Setup Kafka on Brokers via Assignment Role
  hosts: kafka
  become: yes
  roles:
    - kafka

# 2. CREATE KAFKA TOPIC
- name: Create Video Upload Topic on Kafka
  hosts: kafka[0]
  become: yes
  tasks:
    - name: Ensure video-upload-topic exists
      shell: |
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
          --bootstrap-server localhost:9092 \
          --replication-factor 1 \
          --partitions 3 \
          --topic video-upload-topic

# 3. DEPLOY NETFLIX FRONTEND & CONSUMER
- name: Deploy Netflix Frontend App & S3 Connector
  hosts: netflix_app
  become: yes
  vars:
    kafka_broker_ip: "{{ hostvars[groups['kafka'][0]]['ansible_host'] }}"
  tasks:
    - name: Install dependencies
      apt:
        name: [nodejs, npm, python3-pip]
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Python Kafka and Boto3
      pip:
        name: [kafka-python, boto3]

    - name: Ensure app directory exists
      file:
        path: /opt/netflix-app
        state: directory
        owner: ubuntu
        mode: '0755'

    - name: Copy App Code
      copy:
        src: ../app/
        dest: /opt/netflix-app/
        owner: ubuntu
        mode: '0755'

    - name: Install NPM Packages
      command: npm install
      args:
        chdir: /opt/netflix-app

    - name: Systemd Service for App
      copy:
        dest: /etc/systemd/system/netflix-app.service
        content: |
          [Unit]
          Description=Netflix Consumer App
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/opt/netflix-app
          Environment=KAFKA_BROKER={{ kafka_broker_ip }}:9092
          ExecStart=/usr/bin/node server.js
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Systemd Service for S3 Watcher
      copy:
        dest: /etc/systemd/system/s3-watcher.service
        content: |
          [Unit]
          Description=S3 Event to Kafka Watcher
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/opt/netflix-app
          Environment=KAFKA_BROKER={{ kafka_broker_ip }}:9092
          Environment=S3_BUCKET_NAME={{ s3_bucket_name }}
          ExecStart=/usr/bin/python3 s3_watcher.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Start Services
      systemd:
        daemon_reload: yes
        name: "{{ item }}"
        state: restarted
        enabled: yes
      loop:
        - netflix-app
        - s3-watcher